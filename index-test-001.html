<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: sans-serif; background: #0b0914; color: #f1f1f7; padding: 20px; margin: 0; }
    h1 { margin-top: 0; }
    .search { width: 100%; padding: 10px; margin-bottom: 20px; background: #110f24; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
    .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .nav-btn { padding: 8px 12px; background: #110f24; border: 1px solid #333; color: #fff; cursor: pointer; border-radius: 4px; }
    .nav-btn.active { background: #6366f1; border-color: #6366f1; }
    .section { display: none; }
    .section.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .card { padding: 15px; background: #110f24; border: 1px solid #333; border-radius: 5px; text-decoration: none; color: #fff; }
    .card strong { color: #6366f1; display: block; margin-bottom: 5px; }
    .header-link { margin-bottom: 15px; display: block; color: #6366f1; }
    .note { margin-bottom: 15px; font-size: 0.9em; color: #aaa; }
  </style>
</head>

      ]},
      revenue: { title: "Service Revenue", items: [

        { name: "We Work Remotely", url: "https://weworkremotely.com", desc: "Global Remote Jobs Board" },

        { name: "AngelList", url: "https://wellfound.com", desc: "Startup Work & Career Graph Network" },

        { name: "Dynamite Jobs", url: "https://dynamitejobs.com", desc: "Curated Remote Career Hub Platform" },

    };

    const nav = document.getElementById('nav');
    const container = document.getElementById('container');

    Object.keys(database).forEach((key, index) => {
      const cat = database[key];
      const btn = document.createElement('button');
      btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
      btn.innerText = cat.title;
      btn.onclick = () => show(key, btn);
      nav.appendChild(btn);

      const section = document.createElement('div');
      section.id = `sec-${key}`;
      section.className = `section ${index === 0 ? 'active' : ''}`;
      
      if (cat.headerLink) {
        section.innerHTML += `<a href="${cat.headerLink.url}" class="header-link">${cat.headerLink.text}</a>`;
      }
      if (cat.note) section.innerHTML += cat.note;

      const grid = document.createElement('div');
      grid.className = 'grid';
      cat.items.forEach(item => {
        grid.innerHTML += `<a href="${item.url}" class="card" target="_blank"><strong>${item.name}</strong>${item.desc}</a>`;
      });
      section.appendChild(grid);
      container.appendChild(section);
    });

    function show(key, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('sec-' + key).classList.add('active');
      btn.classList.add('active');
    }

    function filter() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
