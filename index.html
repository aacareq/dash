<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0914" />
  <title>Command Center 2026</title>
  <style>
    :root {
      --bg: #0b0914;
      --sidebar-bg: #110f24;
      --card-bg: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.085);
      --text: #f1f1f7;
      --text-muted: #aaa8c0;
      --accent: #818cf8;
      --accent-glow: rgba(129, 140, 248, 0.24);
      --border: rgba(255, 255, 255, 0.1);
      --tag-bg: rgba(129, 140, 248, 0.13);
      --radius: 14px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .light {
      --bg: #f4f5f9;
      --sidebar-bg: #ffffff;
      --card-bg: rgba(30, 27, 75, 0.035);
      --card-hover: rgba(79, 70, 229, 0.08);
      --text: #1e1b4b;
      --text-muted: #5f647c;
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.18);
      --border: rgba(30, 27, 75, 0.12);
      --tag-bg: rgba(79, 70, 229, 0.1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button, input, a, summary { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* Navigation */
    aside {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      padding: 1.5rem;
    }
    .brand {
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -0.5px;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand span { background: linear-gradient(135deg, var(--accent), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-note { color: var(--text-muted); font-size: 0.75rem; margin: 0 0 1.35rem; line-height: 1.4; }
    /*
      Sidebar navigation scroller. The thumb is a brand gradient that stays hidden until the list is hovered,
      focused, or scrolled: the registered --thumb-reveal percentage (inherited by the scrollbar pseudo-elements)
      animates the gradient's opacity via color-mix(). Edge fades (driven by JS classes) hint that more
      categories are available above or below.
    */
    @property --fade-start { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --fade-end { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --thumb-reveal { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      flex-grow: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      margin-right: -9px; /* lets the reserved scrollbar gutter sit in the sidebar padding so buttons stay aligned */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-start), #000 calc(100% - var(--fade-end)), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-start), #000 calc(100% - var(--fade-end)), transparent 100%);
      transition: --thumb-reveal .35s ease, --fade-start .25s ease, --fade-end .25s ease;
    }
    .nav-links.can-scroll-start { --fade-start: 28px; }
    .nav-links.can-scroll-end { --fade-end: 28px; }
    .nav-links:hover, .nav-links:focus-within, .nav-links.is-scrolling { --thumb-reveal: 100%; }
    .nav-links::-webkit-scrollbar { width: 9px; }
    .nav-links::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
    .nav-links::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--accent), #ec4899) padding-box; /* fallback: always-visible gradient */
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) var(--thumb-reveal, 0%), transparent), color-mix(in srgb, #ec4899 var(--thumb-reveal, 0%), transparent)) padding-box;
    }
    .nav-links::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #a5b4fc, #f472b6) padding-box; }
    @supports not selector(::-webkit-scrollbar) {
      .nav-links { scrollbar-width: thin; scrollbar-color: transparent transparent; transition: scrollbar-color .35s ease, --fade-start .25s ease, --fade-end .25s ease; }
      .nav-links:hover, .nav-links:focus-within, .nav-links.is-scrolling { scrollbar-color: var(--accent) transparent; }
    }
    .nav-btn {
      position: relative;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      text-align: left;
      padding: 0.68rem 0.8rem;
      font-size: 0.87rem;
      font-weight: 600;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      white-space: nowrap;
      transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .25s ease;
      animation: nav-in .42s cubic-bezier(.2, .7, .2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 28ms);
    }
    .nav-btn::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 24%;
      bottom: 24%;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent), #ec4899);
      transform: scaleY(0);
      transition: transform .22s ease;
    }
    .nav-btn > span:first-child { transition: transform .22s ease; }
    .nav-btn:hover { color: var(--text); background: var(--card-bg); }
    .nav-btn:hover::before { transform: scaleY(.55); }
    .nav-btn:hover > span:first-child, .nav-btn.active > span:first-child { transform: translateX(4px); }
    .nav-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 14px var(--accent-glow); }
    .nav-btn.active::before { transform: scaleY(1); background: #fff; }
    .nav-btn:focus-visible { outline-offset: -3px; } /* keep the focus ring inside the scroll container */
    .nav-btn.active:focus-visible { outline-color: #fff; }
    .nav-btn .count { font-size: 0.72rem; opacity: .85; background: rgba(0, 0, 0, .2); padding: 2px 6px; border-radius: 8px; }
    @keyframes nav-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

    .sidebar-footer { display: grid; gap: .5rem; margin-top: 1rem; }
    .prev-dashboard {
      display: flex;
      align-items: center;
      gap: .4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: .8rem;
      font-weight: 650;
      padding: .66rem .65rem;
      border: 1px dashed var(--border);
      border-radius: 10px;
      transition: color .2s ease, border-color .2s ease, background-color .2s ease;
    }
    .prev-dashboard:hover { color: var(--text); border-color: var(--accent); background: var(--card-bg); }
    .prev-icon { display: inline-block; transition: transform .2s ease; }
    .prev-dashboard:hover .prev-icon { transform: translateX(-3px); }
    .prev-version { margin-left: auto; color: var(--accent); background: var(--tag-bg); border-radius: 99px; padding: .08rem .38rem; font-size: .66rem; font-weight: 750; }
    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .7rem .75rem;
      border-radius: 10px;
      text-align: left;
      font-weight: 650;
      font-size: .84rem;
    }
    .theme-toggle:hover { background: var(--card-hover); }

    /* Main workspace */
    main { margin-left: 260px; flex-grow: 1; padding: 2.5rem; max-width: 1500px; width: calc(100% - 260px); }
    header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 1.2rem; gap: 1rem; }
    .search-wrapper { position: relative; width: min(100%, 720px); }
    .search-wrapper::before { content: "⌕"; position: absolute; color: var(--text-muted); left: 1rem; top: 50%; transform: translateY(-53%); font-size: 1.25rem; pointer-events: none; }
    .search-bar {
      width: 100%; padding: .9rem 6.5rem .9rem 2.8rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: .95rem;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .search-bar::placeholder { color: var(--text-muted); opacity: .8; }
    .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: var(--sidebar-bg); outline: none; }
    .search-shortcut { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: .12rem .38rem; font-size: .72rem; pointer-events: none; }
    .clear-search { position: absolute; right: 3.3rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-muted); display: none; padding: .25rem; font-size: .8rem; }
    .clear-search:hover { color: var(--text); }
    .search-meta { color: var(--text-muted); font-size: .82rem; min-height: 1.3rem; margin: -.35rem 0 1.35rem .1rem; }

    /* Sections */
    .dashboard-section { margin-bottom: 2.8rem; scroll-margin-top: 1rem; }
    .dashboard-section.is-hidden, .subgroup.is-hidden, .card.is-filtered { display: none; }
    .section-header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
    .section-heading { min-width: 0; }
    .section-title { font-size: 1.1rem; font-weight: 750; color: var(--text); text-transform: uppercase; letter-spacing: .55px; margin: 0; }
    .section-summary { color: var(--text-muted); margin: .28rem 0 0; font-size: .86rem; line-height: 1.45; }
    .section-link { font-size: .82rem; color: var(--accent); text-decoration: none; font-weight: 700; padding: .4rem .7rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; white-space: nowrap; }
    .section-link:hover { background: var(--card-hover); border-color: var(--accent); }
    .section-note { color: var(--text-muted); margin: -.3rem 0 1rem; line-height: 1.55; font-size: .9rem; padding: .8rem 1rem; border-left: 2px solid var(--accent); background: var(--card-bg); border-radius: 0 10px 10px 0; }
    .section-note strong { color: var(--text); }
    .section-toolbar { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tag-filter { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); border-radius: 99px; padding: .38rem .68rem; font-size: .76rem; font-weight: 650; }
    .tag-filter:hover { color: var(--text); background: var(--tag-bg); border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: .9rem; }
    .subgroup { margin: 0 0 1.6rem; }
    .subgroup-title { display: flex; align-items: center; gap: .55rem; margin: 0 0 .7rem; color: var(--text-muted); font-size: .85rem; font-weight: 750; text-transform: uppercase; letter-spacing: .45px; }
    .subgroup-title::after { content: ""; height: 1px; flex: 1; background: var(--border); }

    /* Cards */
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; position: relative; display: flex; flex-direction: column; min-height: 196px;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); box-shadow: 0 9px 22px rgba(0,0,0,.18); }
    .card-main { color: inherit; text-decoration: none; display: block; border-radius: 6px; }
    .card-main:hover .card-title { color: var(--accent); }
    .card-title { font-weight: 760; font-size: 1rem; margin: 0 0 .42rem; line-height: 1.25; transition: color .15s ease; }
    .best-for { color: var(--accent); font-size: .76rem; font-weight: 750; line-height: 1.35; margin: 0 0 .38rem; }
    .card-desc { color: var(--text-muted); font-size: .82rem; line-height: 1.45; margin: 0; }
    .card-tags { display: flex; flex-wrap: wrap; gap: .34rem; margin-top: .72rem; }
    .tag { color: var(--text-muted); background: var(--tag-bg); border: 1px solid transparent; border-radius: 999px; padding: .18rem .43rem; font-size: .68rem; font-weight: 700; line-height: 1.2; }
    .tag.button { cursor: pointer; }
    .tag.button:hover { color: var(--text); border-color: var(--accent); }
    .card-footer { margin-top: auto; padding-top: .8rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .card-actions { display: flex; align-items: center; gap: .28rem; }
    .card-action, .card-details summary { color: var(--text-muted); background: transparent; border: 1px solid var(--border); border-radius: 7px; padding: .31rem .45rem; font-size: .72rem; font-weight: 700; line-height: 1; }
    .card-action:hover, .card-details summary:hover { color: var(--text); border-color: var(--accent); background: var(--tag-bg); }
    .favorite.is-favorite { color: #fbbf24; border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.12); }
    .card-details { position: static; }
    .card-details summary { list-style: none; cursor: pointer; }
    .card-details summary::-webkit-details-marker { display: none; }
    .card-details[open] summary { color: var(--text); border-color: var(--accent); }
    .detail-panel { position: absolute; z-index: 4; left: .7rem; right: .7rem; bottom: 2.85rem; /* sits above the footer so its toggle stays clickable */ padding: .8rem; background: var(--sidebar-bg); border: 1px solid var(--accent); box-shadow: 0 12px 25px rgba(0,0,0,.28); border-radius: 10px; color: var(--text-muted); font-size: .78rem; line-height: 1.45; }
    .detail-panel strong { display: block; color: var(--text); margin-bottom: .2rem; }
    .detail-url { overflow-wrap: anywhere; color: var(--accent); margin-top: .4rem; font-size: .7rem; }
    .empty-state { padding: 1.25rem; color: var(--text-muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: var(--radius); font-size: .9rem; }

    /* Workflow cards retain the familiar card language but surface next actions */
    .workflow-card { min-height: 170px; }
    .workflow-steps { color: var(--text-muted); font-size: .78rem; line-height: 1.45; margin: .55rem 0 0; }
    .workflow-steps span { color: var(--text); font-weight: 700; }
    .workflow-steps .workflow-arrow { color: var(--accent); padding: 0 .16rem; }
    .workflow-steps a { color: var(--accent); font-weight: 700; text-decoration: none; border-bottom: 1px dashed currentColor; }
    .workflow-steps a:hover { color: var(--text); }
    .detail-panel ol { margin: .4rem 0 0; padding-left: 1.1rem; }
    .detail-panel li + li { margin-top: .25rem; }
    .detail-code { display: block; margin-top: .55rem; padding: .45rem .55rem; border-radius: 7px; background: var(--tag-bg); color: var(--text); font: .7rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    .workflow-card .detail-panel { max-height: min(420px, 70vh); overflow: auto; }
    .quick-task { min-height: 155px; }
    .quick-task .card-title { font-size: .93rem; }

    /* Search launchers: type once, then open the same query on any source card in the section */
    .query-panel { margin: 0 0 1rem; padding: .85rem .95rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); }
    .query-label { display: block; margin: 0 0 .5rem; color: var(--text-muted); font-size: .74rem; font-weight: 750; letter-spacing: .45px; text-transform: uppercase; }
    .query-row { display: flex; flex-wrap: wrap; gap: .5rem; }
    .query-input {
      flex: 1 1 260px; min-width: 0; padding: .72rem .9rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: .9rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .query-input::placeholder { color: var(--text-muted); opacity: .8; }
    .query-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); outline: none; }
    .query-go {
      display: inline-flex; align-items: center; justify-content: center; padding: .72rem 1rem; border-radius: 10px; background: var(--accent); color: #fff;
      font-size: .84rem; font-weight: 750; text-decoration: none; white-space: nowrap; transition: filter .15s ease, transform .15s ease;
    }
    .query-go:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .query-hint { margin: .5rem 0 0; color: var(--text-muted); font-size: .76rem; line-height: 1.45; }
    .query-preview { display: none; margin: .5rem 0 0; color: var(--text); font-size: .74rem; font-weight: 700; overflow-wrap: anywhere; }
    .card.has-query { border-color: var(--accent-glow); }
    .card.has-query .query-preview { display: block; }

    /* Section changes fade the new cluster in instead of snapping */
    @keyframes section-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .feed-enter > .dashboard-section { animation: section-in .34s ease backwards; }
    .feed-enter > .dashboard-section:nth-child(2) { animation-delay: .04s; }
    .feed-enter > .dashboard-section:nth-child(3) { animation-delay: .08s; }
    .feed-enter > .dashboard-section:nth-child(n+4) { animation-delay: .12s; }

    @media (max-width: 992px) {
      body { flex-direction: column; }
      aside { position: static; width: 100%; min-height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; flex-direction: row; align-items: center; gap: 1rem; }
      .brand { margin: 0; white-space: nowrap; }
      .brand-note { display: none; }
      .nav-links { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: .55rem .75rem; margin: 0; background: var(--sidebar-bg); border-top: 1px solid var(--border); gap: .35rem; scrollbar-gutter: auto; -webkit-mask-image: none; mask-image: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links { scrollbar-width: none; }
      .nav-btn { flex: 0 0 auto; padding: .52rem .68rem; font-size: .8rem; }
      .sidebar-footer { display: flex; align-items: center; gap: .5rem; margin: 0 0 0 auto; }
      .prev-dashboard { white-space: nowrap; }
      .prev-label { display: none; }
      .prev-version { margin-left: 0; }
      .theme-toggle { margin: 0; white-space: nowrap; }
      main { margin-left: 0; padding: 1.35rem; width: 100%; margin-bottom: 62px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); }
    }
    @media (max-width: 560px) {
      main { padding: 1rem; }
      .brand { font-size: 1rem; }
      .theme-toggle span { display: none; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 175px; }
      .section-title { font-size: 1rem; }
      .search-bar { padding-right: 4.8rem; }
      .search-shortcut { display: none; }
      .clear-search { right: .55rem; }
      .query-go { flex: 1 1 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="brand">🚀 <span>CommandOS-v1.5</span></div>
      <p class="brand-note">Launch tools by task, pin the ones you return to, and keep the full directory close at hand.</p>
    </div>
    <nav class="nav-links" aria-label="Dashboard categories">
      <button class="nav-btn active" type="button" data-section="all" aria-current="page"><span>All Clusters</span></button>
      <button class="nav-btn" type="button" data-section="daily"><span>Daily Core</span> <span class="count" id="cnt-daily">0</span></button>
      <button class="nav-btn" type="button" data-section="inference"><span>Inference</span> <span class="count" id="cnt-inference">0</span></button>
      <button class="nav-btn" type="button" data-section="zerocost"><span>Zero-Cost APIs</span> <span class="count" id="cnt-zerocost">0</span></button>
      <button class="nav-btn" type="button" data-section="agent"><span>Agents</span> <span class="count" id="cnt-agent">0</span></button>
      <button class="nav-btn" type="button" data-section="codingagents"><span>Coding Agents</span> <span class="count" id="cnt-codingagents">0</span></button>
      <button class="nav-btn" type="button" data-section="vibe"><span>Vibe Dev</span> <span class="count" id="cnt-vibe">0</span></button>
      <button class="nav-btn" type="button" data-section="cli"><span>CLI Coding Tools</span> <span class="count" id="cnt-cli">0</span></button>
      <button class="nav-btn" type="button" data-section="freebie"><span>Free Tier Ops</span> <span class="count" id="cnt-freebie">0</span></button>
      <button class="nav-btn" type="button" data-section="technews"><span>Tech News</span> <span class="count" id="cnt-technews">0</span></button>
      <button class="nav-btn" type="button" data-section="research"><span>Trending &amp; Research</span> <span class="count" id="cnt-research">0</span></button>
      <button class="nav-btn" type="button" data-section="socials"><span>Socials</span> <span class="count" id="cnt-socials">0</span></button>
      <button class="nav-btn" type="button" data-section="searchsocials"><span>Search Socials</span> <span class="count" id="cnt-searchsocials">0</span></button>
      <button class="nav-btn" type="button" data-section="revenue"><span>Service Revenue</span> <span class="count" id="cnt-revenue">0</span></button>
    </nav>
    <div class="sidebar-footer">
      <a class="prev-dashboard" href="index-previous.html" aria-label="Open the previous dashboard (CommandOS v1.3)" title="Open the previous dashboard layout (CommandOS v1.3)"><span class="prev-icon" aria-hidden="true">↩</span><span class="prev-label">Previous dashboard</span><span class="prev-version" aria-hidden="true">v1.3</span></a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Toggle color theme">🌓 <span>Theme</span></button>
    </div>
  </aside>

  <main>

    const defaultFavorites = ["daily:github", "inference:gemini", "inference:arena-ai", "inference:claude"];
    const state = { activeSection: "all", query: "", favorites: new Set(), theme: "dark", sectionQueries: {} };
    const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const isExternal = url => /^https?:\/\//i.test(url);
    const isTypingTarget = element => Boolean(element) && (element.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(element.tagName));
    // Search shortcuts: items with a `template` swap {q} for the section's query; with no query they open `url`.
    const fillTemplate = (template, fallback, query) => (query ? template.replaceAll("{q}", encodeURIComponent(query)) : fallback);
    const templatedItems = key => database[key].items.filter(item => item.template);

    function loadPreferences() {
      try {
        const storedFavorites = localStorage.getItem("commandos-favorites-v1");
        state.favorites = new Set(storedFavorites ? JSON.parse(storedFavorites) : defaultFavorites);
        state.theme = localStorage.getItem("commandos-theme") || "dark";
      } catch (error) {
        state.favorites = new Set(defaultFavorites);
      }
      document.body.classList.toggle("light", state.theme === "light");
    }

    function saveFavorites() {
      try { localStorage.setItem("commandos-favorites-v1", JSON.stringify([...state.favorites])); } catch (error) { /* Dashboard still works when storage is unavailable. */ }

    function getItemId(sectionKey, item) { return `${sectionKey}:${slugify(item.name)}`; }
    function flattenItems() {

    function makeTag(label) {

    function makeCard(item, options = {}) {

      card.dataset.id = item.id;
      card.dataset.section = item.sectionKey;
      card.dataset.group = (item.group || "").toLowerCase();
      const searchable = [item.name, item.desc, item.best, ...(item.tags || []), ...(item.aliases || []), item.group || ""].join(" ").toLowerCase();
      card.dataset.search = searchable;
      if (item.template) {
        card.dataset.template = item.template;
        card.dataset.fallback = item.url;
        card.dataset.name = item.name;
      }

      const link = document.createElement("a");
      link.className = "card-main";
      link.href = item.url;
      if (isExternal(item.url) && !item.internal) { link.target = "_blank"; link.rel = "noopener noreferrer"; }
      link.setAttribute("aria-label", `Open ${item.name}${isExternal(item.url) && !item.internal ? " in a new tab" : ""}`);

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = item.name;
      const best = document.createElement("p");

      link.append(title, best, desc);
      if (item.template) {

        preview.className = "query-preview";
        link.appendChild(preview);
      }
      card.appendChild(link);

      if (item.tags?.length) {

        tags.className = "card-tags";

    async function copyText(text, button) {
      const label = button.dataset.label || (button.dataset.label = button.textContent);
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (error) {
        // Fallback for contexts without the async Clipboard API (for example, pages opened from file://).
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { copied = document.execCommand("copy"); } catch (fallbackError) { copied = false; }
        area.remove();
        button.focus();
      }
      button.textContent = copied ? "Copied" : "Copy failed";
      window.setTimeout(() => { button.textContent = label; }, 1300);
    }

    function copyLink(url, button) { return copyText(new URL(url, window.location.href).href, button); }

        a.href = link.url;
        if (isExternal(link.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }

      return header;
    }

    function appendQuickCardActions(card, url) {
      const footer = document.createElement("div");

    function makeWorkflowCard(flow) {
      const card = document.createElement("article");
      card.className = "card workflow-card";
      const stepLabel = step => (typeof step === "string" ? step : step.label);
      card.dataset.search = [flow.title, flow.desc, ...flow.steps.map(stepLabel), ...flow.tags, ...(flow.aliases || [])].join(" ").toLowerCase();
      const link = document.createElement("a");
      link.className = "card-main"; link.href = flow.url; link.target = "_blank"; link.rel = "noopener noreferrer";
      link.innerHTML = `<h3 class="card-title"></h3><p class="best-for">Workflow</p><p class="card-desc"></p>`;
      link.querySelector(".card-title").textContent = flow.title;
      link.querySelector(".card-desc").textContent = flow.desc;
      card.appendChild(link);
      // Steps that have their own URL render outside the main link (links can't nest) so each step opens directly.
      const hasStepLinks = flow.steps.some(step => typeof step === "object" && step.url);
      const steps = document.createElement("p");
      steps.className = "workflow-steps";
      flow.steps.forEach((step, index) => {
        const url = typeof step === "object" ? step.url : "";
        const item = document.createElement(url ? "a" : "span");
        item.textContent = stepLabel(step);
        if (url) { item.href = url; item.target = "_blank"; item.rel = "noopener noreferrer"; item.title = `${stepLabel(step)} (opens in a new tab)`; }
        steps.appendChild(item);
        if (index < flow.steps.length - 1) { const arrow = document.createElement("span"); arrow.className = "workflow-arrow"; arrow.textContent = "→"; arrow.setAttribute("aria-hidden", "true"); steps.appendChild(arrow); }
      });
      (hasStepLinks ? card : link).appendChild(steps);
      const tags = document.createElement("div"); tags.className = "card-tags"; flow.tags.forEach(tag => tags.appendChild(makeTag(tag))); card.appendChild(tags);
      if (flow.snippet || flow.guide?.length) card.appendChild(makeWorkflowFooter(flow));
      return card;
    }

    function makeWorkflowFooter(flow) {
      const footer = document.createElement("div");
      footer.className = "card-footer";
      const actions = document.createElement("div");
      actions.className = "card-actions";
      const copy = document.createElement("button");
      copy.className = "card-action"; copy.type = "button"; copy.textContent = "Copy"; copy.title = "Copy link";

    function makeQueryPanel(key, section) {
      const config = section.searchBox;
      const panel = document.createElement("div");
      panel.className = "query-panel";
      panel.setAttribute("role", "search");
      const label = document.createElement("label");
      label.className = "query-label";
      label.htmlFor = `query-${key}`;
      label.textContent = config.label;
      const row = document.createElement("div");
      row.className = "query-row";
      const input = document.createElement("input");
      input.id = `query-${key}`;
      input.className = "query-input";
      input.type = "search";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.placeholder = config.placeholder;
      input.value = state.sectionQueries[key] || "";
      input.setAttribute("enterkeyhint", "search");
      const go = document.createElement("a");
      go.className = "query-go";
      go.target = "_blank";
      go.rel = "noopener noreferrer";
      go.dataset.queryGo = key;
      row.append(input, go);
      const hint = document.createElement("p");
      hint.className = "query-hint";
      hint.textContent = config.hint;
      panel.append(label, row, hint);
      input.addEventListener("input", () => { state.sectionQueries[key] = input.value; updateTemplatedCards(key); });
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && input.value.trim()) { event.preventDefault(); go.click(); }
        if (event.key === "Escape" && input.value) { event.preventDefault(); input.value = ""; state.sectionQueries[key] = ""; updateTemplatedCards(key); }
      });
      return panel;
    }

    function updateTemplatedCards(key) {
      const query = (state.sectionQueries[key] || "").trim();
      document.querySelectorAll(`.card[data-template][data-section="${key}"]`).forEach(card => {
        const href = fillTemplate(card.dataset.template, card.dataset.fallback, query);
        const link = card.querySelector(".card-main");
        link.href = href;
        link.setAttribute("aria-label", query ? `${card.dataset.name} for “${query}” (opens in a new tab)` : `Open ${card.dataset.name} in a new tab`);
        card.classList.toggle("has-query", Boolean(query));
        const preview = card.querySelector(".query-preview");
        if (preview) preview.textContent = query ? `→ Searches “${query}”` : "";
        const detailUrl = card.querySelector(".detail-url");
        if (detailUrl) detailUrl.textContent = href;
      });
      const go = document.querySelector(`[data-query-go="${key}"]`);
      const primary = templatedItems(key)[0];
      if (go && primary) {
        go.href = fillTemplate(primary.template, primary.url, query);
        go.textContent = `${primary.name} ↗`;
        go.setAttribute("aria-label", query ? `${primary.name} for “${query}” (opens in a new tab)` : `Open ${primary.name} (opens in a new tab)`);
      }
    }

      return card;

    function renderDashboard() {
      const feed = document.getElementById("workspace-feed");
      feed.replaceChildren();
      const allItems = flattenItems();
      if (state.activeSection === "all") renderHomeSections(feed, allItems);

      Object.entries(database).forEach(([key, section]) => {
        const sectionElement = document.createElement("section");
        sectionElement.className = "dashboard-section";
        sectionElement.id = `group-${key}`;
        sectionElement.dataset.key = key;
        sectionElement.appendChild(makeSectionHeader(section.title, section.summary, section.headerLink));

        if (section.note) { const note = document.createElement("div"); note.className = "section-note"; note.innerHTML = section.note; sectionElement.appendChild(note); }
        if (section.filters?.length) {
          const toolbar = document.createElement("div"); toolbar.className = "section-toolbar"; toolbar.setAttribute("aria-label", `${section.title} tags`);
          section.filters.forEach(tag => { const button = document.createElement("button"); button.className = "tag-filter"; button.type = "button"; button.textContent = tag; button.addEventListener("click", () => setSearch(tag)); toolbar.appendChild(button); });
          sectionElement.appendChild(toolbar);
          sectionElement.appendChild(document.createElement("div")).style.height = ".8rem";
        }
        // A search box sits above the cards it drives: inside its named subgroup, or at the top of the section.
        if (section.searchBox && !section.searchBox.group) sectionElement.appendChild(makeQueryPanel(key, section));

        const groups = [...new Set(section.items.map(item => item.group).filter(Boolean))];
        const preparedItems = section.items.map(item => ({ ...item, id: getItemId(key, item), sectionKey: key }));
        if (groups.length) {
          groups.forEach(groupName => {
            const subgroup = document.createElement("div"); subgroup.className = "subgroup"; subgroup.dataset.group = groupName;
            const heading = document.createElement("h3"); heading.className = "subgroup-title"; heading.textContent = groupName; subgroup.appendChild(heading);
            if (section.searchBox?.group === groupName) subgroup.appendChild(makeQueryPanel(key, section));
            const grid = document.createElement("div"); grid.className = "grid";
            renderCards(preparedItems.filter(item => item.group === groupName), grid);
            subgroup.appendChild(grid); sectionElement.appendChild(subgroup);
          });
          const ungrouped = preparedItems.filter(item => !item.group);
          if (ungrouped.length) { const grid = document.createElement("div"); grid.className = "grid"; renderCards(ungrouped, grid); sectionElement.appendChild(grid); }
        } else {
          const grid = document.createElement("div"); grid.className = "grid"; renderCards(preparedItems, grid); sectionElement.appendChild(grid);
        }
        feed.appendChild(sectionElement);
      });

      Object.keys(database).forEach(key => { const count = document.getElementById(`cnt-${key}`); if (count) count.textContent = database[key].items.length; });
      // Re-apply any typed search-shortcut queries (also covers saved search cards shown in Favorites).
      Object.keys(database).forEach(key => { if (database[key].searchBox) updateTemplatedCards(key); });
    }

    function matchesQuery(element, query) { return !query || (element.dataset.search || "").includes(query); }
    function applyFilters() {
      const normalizedQuery = state.query.trim().toLowerCase();
      let resultCount = 0;
      document.querySelectorAll(".home-section").forEach(section => {
        const allowed = state.activeSection === "all";
        let matches = 0;
        section.querySelectorAll(".card").forEach(card => { const match = allowed && matchesQuery(card, normalizedQuery); card.classList.toggle("is-filtered", !match); if (match) matches++; });
        section.classList.toggle("is-hidden", !allowed || matches === 0);
        resultCount += matches;
      });

      document.querySelectorAll(".dashboard-section[data-key]").forEach(section => {
        const allowed = state.activeSection === "all" || section.dataset.key === state.activeSection;
        let sectionMatches = 0;
        section.querySelectorAll(".card").forEach(card => { const match = allowed && matchesQuery(card, normalizedQuery); card.classList.toggle("is-filtered", !match); if (match) sectionMatches++; });
        section.querySelectorAll(".subgroup").forEach(group => { group.classList.toggle("is-hidden", !group.querySelector(".card:not(.is-filtered)")); });
        section.classList.toggle("is-hidden", !allowed || sectionMatches === 0);
        resultCount += sectionMatches;
      });

      const meta = document.getElementById("search-meta");
      const clear = document.getElementById("clear-search");
      clear.style.display = state.query ? "block" : "none";
      if (state.query) meta.textContent = `${resultCount} ${resultCount === 1 ? "result" : "results"} for “${state.query}”${state.activeSection !== "all" ? " in this cluster" : ""}.`;
      else if (state.activeSection !== "all") meta.textContent = `${resultCount} tools in ${database[state.activeSection].title}.`;
      else meta.textContent = "Tip: search by tool, outcome, or a tag such as “coding”, “API”, or “web search”.";
    }

    function selectSection(key, button) {
      state.activeSection = key;
      document.querySelectorAll(".nav-btn").forEach(navButton => { const active = navButton === button; navButton.classList.toggle("active", active); if (active) navButton.setAttribute("aria-current", "page"); else navButton.removeAttribute("aria-current"); });
      renderDashboard();
      applyFilters();
      playFeedTransition();
      keepNavButtonVisible(button);
      document.querySelector("main").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    let feedTransitionTimer;
    function playFeedTransition() {
      const feed = document.getElementById("workspace-feed");
      feed.classList.remove("feed-enter");
      void feed.offsetWidth; // restart the entrance animation
      feed.classList.add("feed-enter");
      window.clearTimeout(feedTransitionTimer);
      // Drop the class afterwards so later re-renders (such as saving a favorite) don't replay the animation.
      feedTransitionTimer = window.setTimeout(() => feed.classList.remove("feed-enter"), 650);
    }

    function keepNavButtonVisible(button) {
      const nav = button.closest(".nav-links");
      if (!nav) return;
      const navBox = nav.getBoundingClientRect();
      const box = button.getBoundingClientRect();
      if (box.left < navBox.left) nav.scrollLeft -= navBox.left - box.left + 12;
      else if (box.right > navBox.right) nav.scrollLeft += box.right - navBox.right + 12;
      if (box.top < navBox.top) nav.scrollTop -= navBox.top - box.top + 12;
      else if (box.bottom > navBox.bottom) nav.scrollTop += box.bottom - navBox.bottom + 12;
    }

    function initNavEffects() {
      const nav = document.querySelector(".nav-links");
      let scrollTimer;
      const updateEdgeFades = () => {
        const horizontal = getComputedStyle(nav).flexDirection === "row";
        const position = horizontal ? nav.scrollLeft : nav.scrollTop;
        const max = horizontal ? nav.scrollWidth - nav.clientWidth : nav.scrollHeight - nav.clientHeight;
        nav.classList.toggle("can-scroll-start", position > 2);
        nav.classList.toggle("can-scroll-end", max - position > 2);
      };
      nav.querySelectorAll(".nav-btn").forEach((button, index) => button.style.setProperty("--i", index));
      nav.addEventListener("scroll", () => {
        nav.classList.add("is-scrolling");
        window.clearTimeout(scrollTimer);
        scrollTimer = window.setTimeout(() => nav.classList.remove("is-scrolling"), 900);
        updateEdgeFades();
      }, { passive: true });
      if ("ResizeObserver" in window) new ResizeObserver(updateEdgeFades).observe(nav);
      else window.addEventListener("resize", updateEdgeFades);
      updateEdgeFades();
    }

    function setSearch(query) {
      const input = document.getElementById("global-search");
      input.value = query;
      state.query = query;
      applyFilters();
      input.focus();
    }

    function initialize() {
      loadPreferences();
      renderDashboard();
      applyFilters();
      initNavEffects();
      playFeedTransition();
      const search = document.getElementById("global-search");
      search.addEventListener("input", event => { state.query = event.target.value; applyFilters(); });
      document.getElementById("clear-search").addEventListener("click", () => setSearch(""));
      document.querySelectorAll(".nav-btn").forEach(button => button.addEventListener("click", () => selectSection(button.dataset.section, button)));
      document.getElementById("theme-toggle").addEventListener("click", () => {
        state.theme = document.body.classList.toggle("light") ? "light" : "dark";
        try { localStorage.setItem("commandos-theme", state.theme); } catch (error) { /* preference is optional */ }
      });
      window.addEventListener("keydown", event => {
        const input = document.getElementById("global-search");
        // "/" jumps to search unless the user is already typing somewhere (including the search-shortcut boxes).
        if (event.key === "/" && !isTypingTarget(document.activeElement) && !event.metaKey && !event.ctrlKey && !event.altKey) { event.preventDefault(); input.focus(); }
        if (event.key === "Escape" && document.activeElement === input && state.query) { setSearch(""); }
        if (event.key === "Escape") {
          const open = document.querySelector(".card-details[open]");
          if (open) { const hadFocus = open.contains(document.activeElement); open.open = false; if (hadFocus) open.querySelector("summary").focus(); }
        }
      });
      // Clicking anywhere outside an open Details/Steps panel closes it.
      document.addEventListener("click", event => { if (!event.target.closest(".card-details")) closeOtherDetails(null); });
    }

    initialize();
  </script>
</body>
</html>
