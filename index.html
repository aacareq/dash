<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center 2026</title>
  <style>
    :root { --bg: #0b0914; --sidebar-bg: #110f24; --card-bg: rgba(255, 255, 255, 0.04); --text: #f1f1f7; --text-muted: #8a88a5; --accent: #6366f1; --border: rgba(255, 255, 255, 0.08); --radius: 12px; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    aside { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 1.5rem; position: fixed; height: 100vh; }
    .nav-links { display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-btn { background: none; border: none; color: var(--text-muted); text-align: left; padding: 0.75rem; cursor: pointer; border-radius: 8px; }
    .nav-btn.active { background: var(--accent); color: #fff; }
    main { margin-left: 260px; padding: 2rem; width: 100%; }
    .search-bar { width: 100%; max-width: 600px; padding: 1rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: #fff; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); padding: 1.25rem; border-radius: var(--radius); text-decoration: none; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <aside>
    <div style="font-weight:700; margin-bottom:1.5rem;">🚀 CommandOS-v1.1</div>
    <nav class="nav-links" id="nav"></nav>

      ]}
    };
    const nav = document.getElementById('nav'), feed = document.getElementById('workspace-feed');
    Object.keys(database).forEach((k, i) => {
      nav.innerHTML += `<button class="nav-btn ${i===0?'active':''}" onclick="filter('${k}', this)">${database[k].title}</button>`;
      feed.innerHTML += `<section id="s-${k}" style="display:${i===0?'block':'none'}"><h2>${database[k].title}</h2><div class="grid" id="g-${k}"></div></section>`;
      database[k].items.forEach(item => {
        document.getElementById(`g-${k}`).innerHTML += `<a class="card" href="${item.url}" target="_blank"><strong>${item.name}</strong><br><small>${item.desc}</small></a>`;
      });
    });
    function filter(k, el) {
      document.querySelectorAll('section').forEach(s => s.style.display = s.id === `s-${k}` ? 'block' : 'none');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
    function processSearch() {
      const q = document.getElementById('global-search').value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }
  </script>
</body>
</html>
