<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center 2026</title>
  <style>
    :root {
      --bg: #0b0914; --sidebar-bg: #110f24; --card-bg: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.09); --text: #f1f1f7; --text-muted: #8a88a5;
      --accent: #6366f1; --accent-glow: rgba(99, 102, 241, 0.2); --border: rgba(255, 255, 255, 0.08);
      --radius: 12px; --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .light {
      --bg: #f4f5f9; --sidebar-bg: #ffffff; --card-bg: rgba(0, 0, 0, 0.03);
      --card-hover: rgba(0, 0, 0, 0.06); --text: #1e1b4b; --text-muted: #64748b;
      --accent: #4f46e5; --accent-glow: rgba(79, 70, 229, 0.15); --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; transition: background 0.2s, border 0.2s; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    aside { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; padding: 1.5rem; }
    .brand { font-size: 1.1rem; font-weight: 700; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { background: linear-gradient(135deg, var(--accent), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; flex-direction: column; gap: 0.35rem; flex-grow: 1; overflow-y: auto; }
    .nav-btn { background: none; border: none; color: var(--text-muted); text-align: left; padding: 0.75rem 1rem; font-size: 0.9rem; font-weight: 500; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .nav-btn:hover { color: var(--text); background: var(--card-bg); }
    .nav-btn.active { color: #fff; background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
    .nav-btn .count { font-size: 0.75rem; opacity: 0.7; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 8px; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: var(--radius); cursor: pointer; margin-top: 1rem; }
    main { margin-left: 260px; flex-grow: 1; padding: 2.5rem; max-width: 1400px; }
    .search-bar { width: 100%; max-width: 600px; padding: 0.8rem 1.2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); margin-bottom: 2rem; }
    .dashboard-section { margin-bottom: 3rem; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-decoration: none; color: var(--text); height: 110px; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { border-color: var(--accent); background: var(--card-hover); }
    .card-title { font-weight: 600; }
    .card-meta { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <aside>
    <div class="brand">🚀 <span>CommandOS-v1.1</span></div>
    <nav class="nav-links">
      <button class="nav-btn active" onclick="filterSection('all', this)">All Clusters</button>
      <button class="nav-btn" onclick="filterSection('daily', this)">Daily Core <span class="count" id="cnt-daily">0</span></button>
      <button class="nav-btn" onclick="filterSection('inference', this)">Inference <span class="count" id="cnt-inference">0</span></button>
      <button class="nav-btn" onclick="filterSection('frontier', this)">Frontier Open Weights <span class="count" id="cnt-frontier">0</span></button>
      <button class="nav-btn" onclick="filterSection('agent', this)">Agents & Pipelines <span class="count" id="cnt-agent">0</span></button>
      <button class="nav-btn" onclick="filterSection('vibe', this)">Vibe Dev <span class="count" id="cnt-vibe">0</span></button>
      <button class="nav-btn" onclick="filterSection('cli', this)">CLI Tools <span class="count" id="cnt-cli">0</span></button>
      <button class="nav-btn" onclick="filterSection('freebie', this)">Free Tier <span class="count" id="cnt-freebie">0</span></button>
      <button class="nav-btn" onclick="filterSection('technews', this)">Tech News <span class="count" id="cnt-technews">0</span></button>
      <button class="nav-btn" onclick="filterSection('socials', this)">Socials <span class="count" id="cnt-socials">0</span></button>
      <button class="nav-btn" onclick="filterSection('revenue', this)">Revenue <span class="count" id="cnt-revenue">0</span></button>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
  </aside>

    function initDashboard() {
      const feed = document.getElementById('workspace-feed');
      for (const [key, section] of Object.entries(database)) {
        document.getElementById(`cnt-${key}`).innerText = section.items.length;
        const s = document.createElement('section');
        s.className = `dashboard-section sect-${key}`;
        s.innerHTML = `<div class="section-title">${section.title}</div><div class="grid" id="grid-${key}"></div>`;
        feed.appendChild(s);
        const g = document.getElementById(`grid-${key}`);
        section.items.forEach(i => {
          g.innerHTML += `<a class="card" href="${i.url}" target="_blank" data-name="${i.name.toLowerCase()}" data-desc="${i.desc.toLowerCase()}"><div class="card-title">${i.name}</div><div class="card-meta">${i.desc}</div></a>`;
        });
      }
    }

    function filterSection(k, e) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      e.classList.add('active');
      document.querySelectorAll('.dashboard-section').forEach(s => s.style.display = (k === 'all' || s.classList.contains(`sect-${k}`)) ? 'block' : 'none');
    }

    function processSearch() {
      const q = document.getElementById('global-search').value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        const match = c.dataset.name.includes(q) || c.dataset.desc.includes(q);
        c.style.display = match ? 'flex' : 'none';
      });
    }

    function toggleTheme() { document.body.classList.toggle('light'); }
    initDashboard();
  </script>
</body>
</html>
