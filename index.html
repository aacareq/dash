<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0914" />
  <title>Command Center 2026</title>
  <style>
    :root {
      --bg: #0b0914;
      --sidebar-bg: #110f24;
      --card-bg: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.085);
      --text: #f1f1f7;
      --text-muted: #aaa8c0;
      --accent: #818cf8;
      --accent-glow: rgba(129, 140, 248, 0.24);
      --border: rgba(255, 255, 255, 0.1);
      --tag-bg: rgba(129, 140, 248, 0.13);
      --radius: 14px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .light {
      --bg: #f4f5f9;
      --sidebar-bg: #ffffff;
      --card-bg: rgba(30, 27, 75, 0.035);
      --card-hover: rgba(79, 70, 229, 0.08);
      --text: #1e1b4b;
      --text-muted: #5f647c;
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.18);
      --border: rgba(30, 27, 75, 0.12);
      --tag-bg: rgba(79, 70, 229, 0.1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button, input, a, summary { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* Navigation */
    aside {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      padding: 1.5rem;
    }
    .brand {
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -0.5px;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand span { background: linear-gradient(135deg, var(--accent), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-note { color: var(--text-muted); font-size: 0.75rem; margin: 0 0 1.35rem; line-height: 1.4; }
    .nav-links { display: flex; flex-direction: column; gap: 0.28rem; flex-grow: 1; overflow-y: auto; }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      text-align: left;
      padding: 0.68rem 0.8rem;
      font-size: 0.87rem;
      font-weight: 600;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      white-space: nowrap;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .nav-btn:hover { color: var(--text); background: var(--card-bg); }
    .nav-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
    .nav-btn .count { font-size: 0.72rem; opacity: .85; background: rgba(0, 0, 0, .2); padding: 2px 6px; border-radius: 8px; }
    .theme-toggle {
      margin-top: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .7rem .75rem;
      border-radius: 10px;
      text-align: left;
      font-weight: 650;
      font-size: .84rem;
    }
    .theme-toggle:hover { background: var(--card-hover); }

    /* Main workspace */
    main { margin-left: 260px; flex-grow: 1; padding: 2.5rem; max-width: 1500px; width: calc(100% - 260px); }
    header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 1.2rem; gap: 1rem; }
    .search-wrapper { position: relative; width: min(100%, 720px); }
    .search-wrapper::before { content: "⌕"; position: absolute; color: var(--text-muted); left: 1rem; top: 50%; transform: translateY(-53%); font-size: 1.25rem; pointer-events: none; }
    .search-bar {
      width: 100%; padding: .9rem 6.5rem .9rem 2.8rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: .95rem;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .search-bar::placeholder { color: var(--text-muted); opacity: .8; }
    .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: var(--sidebar-bg); outline: none; }
    .search-shortcut { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: .12rem .38rem; font-size: .72rem; pointer-events: none; }
    .clear-search { position: absolute; right: 3.3rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-muted); display: none; padding: .25rem; font-size: .8rem; }
    .clear-search:hover { color: var(--text); }
    .search-meta { color: var(--text-muted); font-size: .82rem; min-height: 1.3rem; margin: -.35rem 0 1.35rem .1rem; }

    /* Sections */
    .dashboard-section { margin-bottom: 2.8rem; scroll-margin-top: 1rem; }
    .dashboard-section.is-hidden, .subgroup.is-hidden, .card.is-filtered { display: none; }
    .section-header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
    .section-heading { min-width: 0; }
    .section-title { font-size: 1.1rem; font-weight: 750; color: var(--text); text-transform: uppercase; letter-spacing: .55px; margin: 0; }
    .section-summary { color: var(--text-muted); margin: .28rem 0 0; font-size: .86rem; line-height: 1.45; }
    .section-link { font-size: .82rem; color: var(--accent); text-decoration: none; font-weight: 700; padding: .4rem .7rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; white-space: nowrap; }
    .section-link:hover { background: var(--card-hover); border-color: var(--accent); }
    .section-note { color: var(--text-muted); margin: -.3rem 0 1rem; line-height: 1.55; font-size: .9rem; padding: .8rem 1rem; border-left: 2px solid var(--accent); background: var(--card-bg); border-radius: 0 10px 10px 0; }
    .section-note strong { color: var(--text); }
    .section-toolbar { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tag-filter { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); border-radius: 99px; padding: .38rem .68rem; font-size: .76rem; font-weight: 650; }
    .tag-filter:hover { color: var(--text); background: var(--tag-bg); border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: .9rem; }
    .subgroup { margin: 0 0 1.6rem; }
    .subgroup-title { display: flex; align-items: center; gap: .55rem; margin: 0 0 .7rem; color: var(--text-muted); font-size: .85rem; font-weight: 750; text-transform: uppercase; letter-spacing: .45px; }
    .subgroup-title::after { content: ""; height: 1px; flex: 1; background: var(--border); }

    /* Cards */
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; position: relative; display: flex; flex-direction: column; min-height: 196px;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); box-shadow: 0 9px 22px rgba(0,0,0,.18); }
    .card-main { color: inherit; text-decoration: none; display: block; border-radius: 6px; }
    .card-main:hover .card-title { color: var(--accent); }
    .card-title { font-weight: 760; font-size: 1rem; margin: 0 0 .42rem; line-height: 1.25; transition: color .15s ease; }
    .best-for { color: var(--accent); font-size: .76rem; font-weight: 750; line-height: 1.35; margin: 0 0 .38rem; }
    .card-desc { color: var(--text-muted); font-size: .82rem; line-height: 1.45; margin: 0; }
    .card-tags { display: flex; flex-wrap: wrap; gap: .34rem; margin-top: .72rem; }
    .tag { color: var(--text-muted); background: var(--tag-bg); border: 1px solid transparent; border-radius: 999px; padding: .18rem .43rem; font-size: .68rem; font-weight: 700; line-height: 1.2; }
    .tag.button { cursor: pointer; }
    .tag.button:hover { color: var(--text); border-color: var(--accent); }
    .card-footer { margin-top: auto; padding-top: .8rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .card-actions { display: flex; align-items: center; gap: .28rem; }
    .card-action, .card-details summary { color: var(--text-muted); background: transparent; border: 1px solid var(--border); border-radius: 7px; padding: .31rem .45rem; font-size: .72rem; font-weight: 700; line-height: 1; }
    .card-action:hover, .card-details summary:hover { color: var(--text); border-color: var(--accent); background: var(--tag-bg); }
    .favorite.is-favorite { color: #fbbf24; border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.12); }
    .card-details { position: static; }
    .card-details summary { list-style: none; cursor: pointer; }
    .card-details summary::-webkit-details-marker { display: none; }
    .card-details[open] summary { color: var(--text); border-color: var(--accent); }
    .detail-panel { position: absolute; z-index: 4; left: .7rem; right: .7rem; bottom: .7rem; padding: .8rem; background: var(--sidebar-bg); border: 1px solid var(--accent); box-shadow: 0 12px 25px rgba(0,0,0,.28); border-radius: 10px; color: var(--text-muted); font-size: .78rem; line-height: 1.45; }
    .detail-panel strong { display: block; color: var(--text); margin-bottom: .2rem; }
    .detail-url { overflow-wrap: anywhere; color: var(--accent); margin-top: .4rem; font-size: .7rem; }
    .empty-state { padding: 1.25rem; color: var(--text-muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: var(--radius); font-size: .9rem; }

    /* Workflow cards retain the familiar card language but surface next actions */
    .workflow-card { min-height: 170px; }
    .workflow-steps { color: var(--text-muted); font-size: .78rem; line-height: 1.45; margin: .55rem 0 0; }
    .workflow-steps span { color: var(--text); font-weight: 700; }
    .workflow-arrow { color: var(--accent); padding: 0 .16rem; }
    .quick-task { min-height: 155px; }
    .quick-task .card-title { font-size: .93rem; }

    @media (max-width: 992px) {
      body { flex-direction: column; }
      aside { position: static; width: 100%; min-height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; flex-direction: row; align-items: center; gap: 1rem; }
      .brand { margin: 0; white-space: nowrap; }
      .brand-note { display: none; }
      .nav-links { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: .55rem .75rem; background: var(--sidebar-bg); border-top: 1px solid var(--border); gap: .35rem; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links { scrollbar-width: none; }
      .nav-btn { flex: 0 0 auto; padding: .52rem .68rem; font-size: .8rem; }
      .theme-toggle { margin: 0 0 0 auto; white-space: nowrap; }
      main { margin-left: 0; padding: 1.35rem; width: 100%; margin-bottom: 62px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); }
    }
    @media (max-width: 560px) {
      main { padding: 1rem; }
      .brand { font-size: 1rem; }
      .theme-toggle span { display: none; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 175px; }
      .section-title { font-size: 1rem; }
      .search-bar { padding-right: 4.8rem; }
      .search-shortcut { display: none; }
      .clear-search { right: .55rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>

    const defaultFavorites = ["daily:github", "inference:gemini", "inference:arena-ai", "inference:claude"];
    const state = { activeSection: "all", query: "", favorites: new Set(), theme: "dark" };
    const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const isExternal = url => /^https?:\/\//i.test(url);

    function loadPreferences() {
      try {
        const storedFavorites = localStorage.getItem("commandos-favorites-v1");
        state.favorites = new Set(storedFavorites ? JSON.parse(storedFavorites) : defaultFavorites);
        state.theme = localStorage.getItem("commandos-theme") || "dark";
      } catch (error) {
        state.favorites = new Set(defaultFavorites);
      }
      document.body.classList.toggle("light", state.theme === "light");
    }

    function saveFavorites() {
      try { localStorage.setItem("commandos-favorites-v1", JSON.stringify([...state.favorites])); } catch (error) { /* Dashboard still works when storage is unavailable. */ }
    }

    function getItemId(sectionKey, item) { return `${sectionKey}:${slugify(item.name)}`; }
    function flattenItems() {
      return Object.entries(database).flatMap(([sectionKey, section]) => section.items.map(item => ({ ...item, sectionKey, id: getItemId(sectionKey, item) })));
    }

    function makeTag(label) {
      const tag = document.createElement("button");
      tag.className = "tag button";
      tag.type = "button";
      tag.textContent = label;
      tag.title = `Filter by ${label}`;
      tag.addEventListener("click", () => setSearch(label));
      return tag;
    }

    function makeCard(item, options = {}) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.id = item.id;
      card.dataset.section = item.sectionKey;
      card.dataset.group = (item.group || "").toLowerCase();
      const searchable = [item.name, item.desc, item.best, ...(item.tags || []), ...(item.aliases || []), item.group || ""].join(" ").toLowerCase();
      card.dataset.search = searchable;

      const link = document.createElement("a");
      link.className = "card-main";
      link.href = item.url;
      if (isExternal(item.url) && !item.internal) { link.target = "_blank"; link.rel = "noopener noreferrer"; }
      link.setAttribute("aria-label", `Open ${item.name}${isExternal(item.url) && !item.internal ? " in a new tab" : ""}`);

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = item.name;
      const best = document.createElement("p");
      best.className = "best-for";
      best.textContent = `Best for: ${item.best || "quick access"}`;
      const desc = document.createElement("p");
      desc.className = "card-desc";
      desc.textContent = item.desc;
      link.append(title, best, desc);
      card.appendChild(link);

      if (item.tags?.length) {
        const tags = document.createElement("div");
        tags.className = "card-tags";
        tags.setAttribute("aria-label", "Tags");
        item.tags.forEach(tag => tags.appendChild(makeTag(tag)));
        card.appendChild(tags);
      }

      const footer = document.createElement("div");
      footer.className = "card-footer";
      const actions = document.createElement("div");
      actions.className = "card-actions";

      const favorite = document.createElement("button");
      favorite.className = "card-action favorite";
      favorite.type = "button";
      favorite.dataset.favorite = item.id;
      favorite.title = "Add to favorites";
      updateFavoriteButton(favorite, item.id, item.name);
      favorite.addEventListener("click", () => toggleFavorite(item.id));

      const copy = document.createElement("button");
      copy.className = "card-action";
      copy.type = "button";
      copy.textContent = "Copy";
      copy.title = "Copy link";
      copy.addEventListener("click", () => copyLink(item.url, copy));
      actions.append(favorite, copy);

      const details = document.createElement("details");
      details.className = "card-details";
      const summary = document.createElement("summary");
      summary.textContent = "Details";
      const panel = document.createElement("div");
      panel.className = "detail-panel";
      const detailTitle = document.createElement("strong");
      detailTitle.textContent = item.best ? `Use ${item.name} when you need ${item.best.toLowerCase()}.` : `About ${item.name}`;
      const detailText = document.createElement("span");
      detailText.textContent = item.detail || item.desc;
      const url = document.createElement("div");
      url.className = "detail-url";
      url.textContent = item.url;
      panel.append(detailTitle, detailText, url);
      details.append(summary, panel);
      details.addEventListener("toggle", () => { if (details.open) closeOtherDetails(details); });
      footer.append(actions, details);
      card.appendChild(footer);
      return card;
    }

    function closeOtherDetails(current) {
      document.querySelectorAll(".card-details[open]").forEach(details => { if (details !== current) details.open = false; });
    }

    function updateFavoriteButton(button, id, name) {
      const favored = state.favorites.has(id);
      button.classList.toggle("is-favorite", favored);
      button.textContent = favored ? "★ Saved" : "☆ Save";
      button.title = favored ? `Remove ${name} from favorites` : `Add ${name} to favorites`;
      button.setAttribute("aria-pressed", String(favored));
    }

    function toggleFavorite(id) {
      state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
      saveFavorites();
      renderDashboard();
      applyFilters();
    }

    async function copyLink(url, button) {
      const original = button.textContent;
      try {
        await navigator.clipboard.writeText(new URL(url, window.location.href).href);
        button.textContent = "Copied";
      } catch (error) {
        button.textContent = "Copy failed";
      }
      window.setTimeout(() => { button.textContent = original; }, 1300);
    }

    function makeSectionHeader(title, summary, link) {
      const header = document.createElement("div");
      header.className = "section-header";
      const heading = document.createElement("div");
      heading.className = "section-heading";
      const h2 = document.createElement("h2");
      h2.className = "section-title";
      h2.textContent = title;
      heading.appendChild(h2);
      if (summary) { const text = document.createElement("p"); text.className = "section-summary"; text.textContent = summary; heading.appendChild(text); }
      header.appendChild(heading);
      if (link) {
        const a = document.createElement("a");
        a.className = "section-link";
        a.textContent = link.text;
        a.href = link.url;
        if (isExternal(link.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
        header.appendChild(a);
      }
      return header;
    }

    function renderCards(items, grid) { items.forEach(item => grid.appendChild(makeCard(item))); }

    function renderHomeSections(feed, allItems) {
      // Keep saved tools in the user's chosen order (the supplied defaults are GitHub, Gemini, Arena AI, Claude).
      const favorites = [...state.favorites].map(id => allItems.find(item => item.id === id)).filter(Boolean);
      const favoriteSection = document.createElement("section");
      favoriteSection.className = "dashboard-section home-section";
      favoriteSection.dataset.home = "true";
      favoriteSection.appendChild(makeSectionHeader("Favorites", "Your saved launch points. Use ☆ Save on any card to change this list."));
      const favoriteGrid = document.createElement("div");
      favoriteGrid.className = "grid";
      if (favorites.length) renderCards(favorites, favoriteGrid);
      else favoriteGrid.innerHTML = '<div class="empty-state">No favorites saved yet. Use the ☆ Save button on any service card.</div>';
      favoriteSection.appendChild(favoriteGrid);
      feed.appendChild(favoriteSection);

      const workflows = [
        { title: "Start coding session", desc: "Open your repository, launch a workspace, then bring in an AI assistant.", steps: ["GitHub", "Codespaces", "ChatGPT"], url: "https://github.com", tags: ["coding", "daily"] },

        { title: "Deploy a project", desc: "Start from the repo, publish the frontend, then add edge compute as needed.", steps: ["GitHub", "Cloudflare Pages", "Workers"], url: "https://pages.cloudflare.com", tags: ["deploy", "cloudflare"] }
      ];
      const workflowSection = document.createElement("section");
      workflowSection.className = "dashboard-section home-section";
      workflowSection.dataset.home = "true";
      workflowSection.appendChild(makeSectionHeader("Workflows", "Task-first launch sequences for common work."));
      const workflowGrid = document.createElement("div");
      workflowGrid.className = "grid";
      workflows.forEach(flow => workflowGrid.appendChild(makeWorkflowCard(flow)));
      workflowSection.appendChild(workflowGrid);

      const tasks = [
        { title: "Write prose", best: "Draft and revise clear writing", desc: "Open Claude for structured drafting, editing, and long-form analysis.", url: "https://claude.ai", tags: ["writing", "prose", "inference"] },
        { title: "Write sci-fact-fic", best: "Creative speculative writing", desc: "Open Gemini to explore science-grounded ideas, scenes, and variations.", url: "https://gemini.google.com", tags: ["writing", "creative", "inference"] },
        { title: "Code a Cloudflare Worker", best: "Edge API and automation work", desc: "Open Cloudflare Workers to create and deploy serverless edge code.", url: "https://workers.cloudflare.com", tags: ["coding", "cloudflare", "edge"] },
        { title: "Get Gemini API keys", best: "Gemini API setup", desc: "Open AI Studio's API-key page to create or manage Gemini credentials.", url: "https://aistudio.google.com/apikey", tags: ["gemini", "API", "setup"] }
      ];
      const taskSection = document.createElement("section");
      taskSection.className = "dashboard-section home-section";
      taskSection.dataset.home = "true";
      taskSection.appendChild(makeSectionHeader("Inference tasks", "Start from the outcome you want, not the provider name."));
      const taskGrid = document.createElement("div");
      taskGrid.className = "grid";
      tasks.forEach(task => taskGrid.appendChild(makeTaskCard(task)));

    function appendQuickCardActions(card, url) {
      const footer = document.createElement("div");
      footer.className = "card-footer";
      const actions = document.createElement("div");
      actions.className = "card-actions";
      const copy = document.createElement("button");
      copy.className = "card-action";
      copy.type = "button";
      copy.textContent = "Copy";
      copy.title = "Copy launch link";
      copy.addEventListener("click", () => copyLink(url, copy));
      actions.appendChild(copy);
      footer.appendChild(actions);
      card.appendChild(footer);
    }

    function makeWorkflowCard(flow) {
      const card = document.createElement("article");
      card.className = "card workflow-card";
      card.dataset.search = [flow.title, flow.desc, ...flow.steps, ...flow.tags].join(" ").toLowerCase();
      const link = document.createElement("a");
      link.className = "card-main"; link.href = flow.url; link.target = "_blank"; link.rel = "noopener noreferrer";
      link.innerHTML = `<h3 class="card-title"></h3><p class="best-for">Workflow</p><p class="card-desc"></p>`;
      link.querySelector(".card-title").textContent = flow.title;
      link.querySelector(".card-desc").textContent = flow.desc;
      const steps = document.createElement("p");
      steps.className = "workflow-steps";
      flow.steps.forEach((step, index) => { const item = document.createElement("span"); item.textContent = step; steps.appendChild(item); if (index < flow.steps.length - 1) { const arrow = document.createElement("span"); arrow.className = "workflow-arrow"; arrow.textContent = "→"; steps.appendChild(arrow); } });
      link.appendChild(steps); card.appendChild(link);
      const tags = document.createElement("div"); tags.className = "card-tags"; flow.tags.forEach(tag => tags.appendChild(makeTag(tag))); card.appendChild(tags);
      return card;
    }

    function makeTaskCard(task) {
      const card = document.createElement("article");
      card.className = "card quick-task";
      card.dataset.search = [task.title, task.best, task.desc, ...task.tags].join(" ").toLowerCase();
      const link = document.createElement("a");
      link.className = "card-main"; link.href = task.url; link.target = "_blank"; link.rel = "noopener noreferrer";
      link.innerHTML = `<h3 class="card-title"></h3><p class="best-for"></p><p class="card-desc"></p>`;
      link.querySelector(".card-title").textContent = task.title;
      link.querySelector(".best-for").textContent = `Best for: ${task.best}`;
      link.querySelector(".card-desc").textContent = task.desc;
      card.appendChild(link);
      const tags = document.createElement("div"); tags.className = "card-tags"; task.tags.forEach(tag => tags.appendChild(makeTag(tag))); card.appendChild(tags);
      appendQuickCardActions(card, task.url);
      return card;
    }

    function renderDashboard() {
      const feed = document.getElementById("workspace-feed");
      feed.replaceChildren();
      const allItems = flattenItems();
      if (state.activeSection === "all") renderHomeSections(feed, allItems);

      Object.entries(database).forEach(([key, section]) => {
        const sectionElement = document.createElement("section");
        sectionElement.className = "dashboard-section";
        sectionElement.id = `group-${key}`;
        sectionElement.dataset.key = key;
        sectionElement.appendChild(makeSectionHeader(section.title, section.summary, section.headerLink));

        if (section.note) { const note = document.createElement("div"); note.className = "section-note"; note.innerHTML = section.note; sectionElement.appendChild(note); }
        if (section.filters?.length) {
          const toolbar = document.createElement("div"); toolbar.className = "section-toolbar"; toolbar.setAttribute("aria-label", "Inference tags");
          section.filters.forEach(tag => { const button = document.createElement("button"); button.className = "tag-filter"; button.type = "button"; button.textContent = tag; button.addEventListener("click", () => setSearch(tag)); toolbar.appendChild(button); });
          sectionElement.appendChild(toolbar);
          sectionElement.appendChild(document.createElement("div")).style.height = ".8rem";
        }

        const groups = [...new Set(section.items.map(item => item.group).filter(Boolean))];
        const preparedItems = section.items.map(item => ({ ...item, id: getItemId(key, item), sectionKey: key }));
        if (groups.length) {
          groups.forEach(groupName => {
            const subgroup = document.createElement("div"); subgroup.className = "subgroup"; subgroup.dataset.group = groupName;
            const heading = document.createElement("h3"); heading.className = "subgroup-title"; heading.textContent = groupName; subgroup.appendChild(heading);
            const grid = document.createElement("div"); grid.className = "grid";
            renderCards(preparedItems.filter(item => item.group === groupName), grid);
            subgroup.appendChild(grid); sectionElement.appendChild(subgroup);
          });
          const ungrouped = preparedItems.filter(item => !item.group);
          if (ungrouped.length) { const grid = document.createElement("div"); grid.className = "grid"; renderCards(ungrouped, grid); sectionElement.appendChild(grid); }
        } else {
          const grid = document.createElement("div"); grid.className = "grid"; renderCards(preparedItems, grid); sectionElement.appendChild(grid);
        }
        feed.appendChild(sectionElement);
      });

      Object.keys(database).forEach(key => { const count = document.getElementById(`cnt-${key}`); if (count) count.textContent = database[key].items.length; });
    }

    function matchesQuery(element, query) { return !query || (element.dataset.search || "").includes(query); }
    function applyFilters() {
      const normalizedQuery = state.query.trim().toLowerCase();
      let resultCount = 0;
      document.querySelectorAll(".home-section").forEach(section => {
        const allowed = state.activeSection === "all";
        let matches = 0;
        section.querySelectorAll(".card").forEach(card => { const match = allowed && matchesQuery(card, normalizedQuery); card.classList.toggle("is-filtered", !match); if (match) matches++; });
        section.classList.toggle("is-hidden", !allowed || matches === 0);
        resultCount += matches;
      });

      document.querySelectorAll(".dashboard-section[data-key]").forEach(section => {
        const allowed = state.activeSection === "all" || section.dataset.key === state.activeSection;
        let sectionMatches = 0;
        section.querySelectorAll(".card").forEach(card => { const match = allowed && matchesQuery(card, normalizedQuery); card.classList.toggle("is-filtered", !match); if (match) sectionMatches++; });
        section.querySelectorAll(".subgroup").forEach(group => { group.classList.toggle("is-hidden", !group.querySelector(".card:not(.is-filtered)")); });
        section.classList.toggle("is-hidden", !allowed || sectionMatches === 0);
        resultCount += sectionMatches;
      });

      const meta = document.getElementById("search-meta");
      const clear = document.getElementById("clear-search");
      clear.style.display = state.query ? "block" : "none";
      if (state.query) meta.textContent = `${resultCount} ${resultCount === 1 ? "result" : "results"} for “${state.query}”${state.activeSection !== "all" ? " in this cluster" : ""}.`;
      else if (state.activeSection !== "all") meta.textContent = `${resultCount} tools in ${database[state.activeSection].title}.`;
      else meta.textContent = "Tip: search by tool, outcome, or a tag such as “coding”, “API”, or “web search”.";
    }

    function selectSection(key, button) {
      state.activeSection = key;
      document.querySelectorAll(".nav-btn").forEach(navButton => { const active = navButton === button; navButton.classList.toggle("active", active); if (active) navButton.setAttribute("aria-current", "page"); else navButton.removeAttribute("aria-current"); });
      renderDashboard();
      applyFilters();
      document.querySelector("main").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function setSearch(query) {
      const input = document.getElementById("global-search");
      input.value = query;
      state.query = query;
      applyFilters();
      input.focus();
    }

    function initialize() {
      loadPreferences();
      renderDashboard();
      applyFilters();
      const search = document.getElementById("global-search");
      search.addEventListener("input", event => { state.query = event.target.value; applyFilters(); });
      document.getElementById("clear-search").addEventListener("click", () => setSearch(""));
      document.querySelectorAll(".nav-btn").forEach(button => button.addEventListener("click", () => selectSection(button.dataset.section, button)));
      document.getElementById("theme-toggle").addEventListener("click", () => {
        state.theme = document.body.classList.toggle("light") ? "light" : "dark";
        try { localStorage.setItem("commandos-theme", state.theme); } catch (error) { /* preference is optional */ }
      });
      window.addEventListener("keydown", event => {
        const input = document.getElementById("global-search");
        if (event.key === "/" && document.activeElement !== input && !event.metaKey && !event.ctrlKey && !event.altKey) { event.preventDefault(); input.focus(); }
        if (event.key === "Escape" && document.activeElement === input && state.query) { setSearch(""); }
      });
    }

    initialize();
  </script>
</body>
</html>
