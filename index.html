  <style>
    :root {
      --bg: #0b0914;
      --sidebar-bg: #110f24;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.09);
      --text: #f1f1f7;
      --text-muted: #8a88a5;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .light {
      --bg: #f4f5f9;
      --sidebar-bg: #ffffff;
      --card-bg: rgba(0, 0, 0, 0.03);
      --card-hover: rgba(0, 0, 0, 0.06);
      --text: #1e1b4b;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.15);
      --border: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; transition: background 0.2s, border 0.2s; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Sidebar Navigation (Desktop) --- */
    aside {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 10;
      padding: 1.5rem;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span {
      background: linear-gradient(135deg, var(--accent), #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-grow: 1;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text);
      background: var(--card-bg);
    }

    .nav-btn.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .nav-btn .count {
      font-size: 0.75rem;
      opacity: 0.7;
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 8px;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    /* --- Main Workspace --- */
    main {
      margin-left: 260px;
      flex-grow: 1;
      padding: 2.5rem;
      max-width: 1400px;
      width: calc(100% - 260px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 2rem;
    }

    .search-wrapper {
      position: relative;
      flex-grow: 1;
      max-width: 600px;
    }

    .search-bar {
      width: 100%;
      padding: 0.8rem 1.2rem 0.8rem 2.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-wrapper::before {
      content: "⚡";
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }

    /* --- Content Sections --- */
    .dashboard-section {
      margin-bottom: 3rem;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-link {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 4px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .section-link:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    /* --- Quick Action Grid Layout --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      position: relative;
      overflow: hidden;
      transform: translateY(0);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), background 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin: 0;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Section-specific accents */
    .sect-daily .card:hover { --accent: #3b82f6; }
    .sect-zerocost .card:hover { --accent: #22d3ee; }
    .sect-inference .card:hover { --accent: #10b981; }
    .sect-agent .card:hover { --accent: #f59e0b; }
    .sect-vibe .card:hover { --accent: #ec4899; }
    .sect-cli .card:hover { --accent: #06b6d4; }
    .sect-freebie .card:hover { --accent: #8b5cf6; }
    .sect-technews .card:hover { --accent: #f97316; }
    .sect-socials .card:hover { --accent: #10b981; }
    .sect-revenue .card:hover { --accent: #14b8a6; }

    .section-note {
      color: var(--text-muted);
      margin: -0.5rem 0 1rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .section-note strong {
      color: var(--text);
      font-weight: 600;
    }

    /* CSS Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Responsive scaling Overhaul --- */
    @media (max-width: 992px) {
      body {
        flex-direction: column;
      }
      
      /* Hide regular desktop sidebar container assets */
      aside {
        position: static;
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.5rem;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        margin-bottom: 0;
      }

      /* Transform layout into a horizontal swipe navigation block */
      .nav-links {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        background: var(--sidebar-bg);
        border-top: 1px solid var(--border);
        flex-direction: row;
        padding: 0.6rem 1rem;
        gap: 0.5rem;
        overflow-x: auto;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        z-index: 100;
      }

      /* Hide scrollbars elegantly while preserving operational swipe features */
      .nav-links::-webkit-scrollbar {
        display: none;
      }
      .nav-links {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .nav-btn {
        padding: 0.5rem 0.8rem;
        font-size: 0.85rem;
        gap: 0.4rem;
      }

      main {
        margin-left: 0;
        padding: 1.5rem;
        width: 100%;
        margin-bottom: 60px; /* Space out room on mobile viewports so bottom navigation doesn't clip content */
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
      
      .card {
        height: 100px;
        padding: 1rem;
      }
    }
  </style>
</head>

    function initDashboard() {

        }

          headerHTML += `<div class="section-note">${section.note}</div>`;
        }
        headerHTML += `<div class="grid" id="grid-${key}"></div>`;

        sectWrapper.innerHTML = headerHTML;
        feed.appendChild(sectWrapper);

        const grid = document.getElementById(`grid-${key}`);
        section.items.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.url;
          card.target = '_blank';
          card.setAttribute('data-name', item.name.toLowerCase());
          card.setAttribute('data-desc', item.desc.toLowerCase());

          card.innerHTML = `
            <div class="card-title">${item.name}</div>
            <div class="card-meta">${item.desc}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    // Snappy Dynamic Client-side Component Filtering
    function filterSection(targetKey, element) {
      // Toggle sidebar button selections
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      // Manipulate visual elements dynamically
      const sections = document.querySelectorAll('.dashboard-section');
      sections.forEach(sec => {
        if (targetKey === 'all' || sec.classList.contains(`sect-${targetKey}`)) {
          sec.style.display = 'block';
          sec.style.animation = 'fadeIn 0.25s ease forwards';
        } else {
          sec.style.display = 'none';
        }
      });
    }

    // High Performance Global Fuzzy Matches
    function processSearch() {
      const query = document.getElementById('global-search').value.toLowerCase();
      const sections = document.querySelectorAll('.dashboard-section');

      sections.forEach(sec => {
        let visibleInSectionCount = 0;
        const cards = sec.querySelectorAll('.card');

        cards.forEach(card => {
          const matchName = card.getAttribute('data-name').includes(query);
          const matchDesc = card.getAttribute('data-desc').includes(query);

          if (matchName || matchDesc) {
            card.style.display = 'flex';
            visibleInSectionCount++;
          } else {
            card.style.display = 'none';
          }
        });

        // Hide structural containers if inner search matches are null
        sec.style.display = visibleInSectionCount > 0 ? 'block' : 'none';
      });
    }

    // Theme Customizer Logic
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    // Hotkey listener integration (Press '/' to refocus search instantly)
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== document.getElementById('global-search')) {
        e.preventDefault();
        document.getElementById('global-search').focus();
      }
    });

    // Boot engine instance
    initDashboard();
  </script>
</body>
</html>
