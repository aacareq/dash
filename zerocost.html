<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zero-Cost Harness Hub</title>
  <style>
    :root {
      --bg: #05060c;
      --bg-2: #0b0e1a;
      --glass: rgba(255,255,255,.045);
      --glass-2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.1);
      --text: #eef1ff;
      --muted: #8b90b3;
      --accent: #67e8f9;
      --violet: #a78bfa;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --r: 16px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .light {
      --bg: #eef1f8;
      --bg-2: #ffffff;
      --glass: rgba(15,18,40,.04);
      --glass-2: rgba(15,18,40,.08);
      --stroke: rgba(15,18,40,.1);
      --text: #121528;
      --muted: #5b6080;
      --shadow: 0 18px 40px rgba(40,50,90,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body {
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(103,232,249,.16), transparent 50%),
        radial-gradient(700px 380px at 110% 0%, rgba(167,139,250,.16), transparent 46%),
        var(--bg);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--accent); }
    .app { max-width: 1280px; margin: 0 auto; padding: 14px 14px 92px; }
    .top {
      display: flex; align-items: center; gap: 10px; justify-content: space-between;
      padding: 10px 12px; border: 1px solid var(--stroke); background: var(--glass);
      backdrop-filter: blur(18px); border-radius: 18px; position: sticky; top: 10px; z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      background: linear-gradient(135deg, var(--accent), var(--violet));
      box-shadow: 0 0 24px rgba(103,232,249,.35);
    }
    .brand h1 { margin: 0; font-size: .95rem; letter-spacing: -.3px; white-space: nowrap; }
    .brand p { margin: 0; font-size: .7rem; color: var(--muted); }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--stroke); background: var(--glass-2); color: var(--text);
      border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .82rem;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: linear-gradient(135deg, #155e75, #5b21b6); border-color: transparent; color: #fff; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; margin: 14px 0; padding: 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      border: 1px solid var(--stroke); background: var(--glass); border-radius: 999px;
      padding: 8px 12px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 600; font-size: .8rem;
    }
    .tab.on { color: #041016; background: var(--accent); border-color: transparent; }
    .grid { display: grid; gap: 12px; }
    .g-2 { grid-template-columns: 1fr; }
    .g-3 { grid-template-columns: 1fr; }
    .card {
      background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r);
      padding: 14px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 8px; font-size: .95rem; }
    .muted { color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--stroke);
      border-radius: 999px; padding: 4px 8px; font-size: .72rem; color: var(--muted); margin: 2px;
    }
    .chip.ok { color: var(--ok); border-color: rgba(52,211,153,.35); }
    .chip.warn { color: var(--warn); border-color: rgba(251,191,36,.35); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 6px; font-size: .75rem; color: var(--muted); flex: 1; min-width: 140px; }
    input, select, textarea {
      width: 100%; background: rgba(0,0,0,.22); border: 1px solid var(--stroke); border-radius: 12px;
      padding: 10px 12px; outline: none;
    }
    .light input, .light select, .light textarea { background: #fff; }
    textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: .82rem; }
    .log {
      background: rgba(0,0,0,.28); border: 1px solid var(--stroke); border-radius: 12px;
      padding: 10px; font-family: var(--mono); font-size: .75rem; white-space: pre-wrap; max-height: 280px; overflow: auto;
    }
    .portal {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      text-decoration: none; color: inherit; padding: 10px; border-radius: 12px; border: 1px solid var(--stroke);
      background: var(--glass-2);
    }
    .portal:hover { border-color: var(--accent); }
    .drawer, .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: none; align-items: flex-end; justify-content: center;
    }
    .drawer.on, .modal.on { display: flex; }
    .sheet {
      width: min(720px, 100%); max-height: 92vh; overflow: auto; background: var(--bg-2);
      border: 1px solid var(--stroke); border-radius: 20px 20px 0 0; padding: 16px; box-shadow: var(--shadow);
    }
    .modal .sheet { border-radius: 20px; margin: 12px; align-self: center; }
    .toast {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 10px 14px; border-radius: 999px; font-size: .8rem;
      display: none; z-index: 80; border: 1px solid var(--stroke);
    }
    .node-canvas {
      position: relative; height: 420px; border: 1px dashed var(--stroke); border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, rgba(103,232,249,.04), transparent);
      touch-action: none;
    }
    svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .gnode {
      position: absolute; width: 168px; padding: 8px 10px; border-radius: 12px; background: var(--bg-2);
      border: 1px solid var(--stroke); cursor: grab; user-select: none; font-size: .75rem;
    }
    .gnode.running { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(103,232,249,.2); }
    .gnode.ok { border-color: var(--ok); }
    .gnode.err { border-color: var(--bad); }
    .port {
      position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      top: 50%; transform: translateY(-50%); cursor: pointer;
    }
    .port.in { left: -6px; } .port.out { right: -6px; }
    .model { cursor: pointer; }
    .model:hover { border-color: var(--violet); }
    .prompt {
      border: 1px solid var(--stroke); border-radius: 12px; padding: 10px; margin: 8px 0; background: var(--glass);
    }
    .prompt pre { white-space: pre-wrap; font-family: var(--mono); font-size: .75rem; margin: 8px 0 0; }
    .feed-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--stroke); }
    @media (min-width: 760px) {
      .g-2 { grid-template-columns: 1.1fr .9fr; }
      .g-3 { grid-template-columns: repeat(3, 1fr); }
      .app { padding-bottom: 28px; }
      .drawer { align-items: center; }
      .sheet { border-radius: 20px; }
    }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #view { animation: fade .28s ease; }
  </style>
</head>

  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.display = "none", 2200);
}

      <div class="grid g-2">

      </div>
    </section>`;
  wireProvider("l-provider", "l-model");
  document.getElementById("l-run").onclick = async () => {
    const log = document.getElementById("l-log");
    const provider = document.getElementById("l-provider").value;
    const model = document.getElementById("l-model").value;
    const task = document.getElementById("l-task").value;
    const crit = document.getElementById("l-crit").value;
    const n = +document.getElementById("l-n").value;
    let feedback = "";
    log.textContent = "";
    try {
      for (let i = 1; i <= n; i++) {
        log.textContent += `\n=== GENERATE ${i}/${n} ===\n`;
        const gen = await infer({
          provider, model,
          system: "You generate artifacts. Improve using judge feedback when present.",
          user: `TASK:\n${task}\n\nFEEDBACK:\n${feedback || "none"}`
        });
        log.textContent += gen + `\n\n=== JUDGE ${i} ===\n`;
        const judge = await infer({
          provider, model, json: true,
          system: "You are a strict judge. Return JSON {\"verdict\":\"PASS\"|\"FAIL\",\"feedback\":\"...\"} only.",
          user: `CRITERIA:\n${crit}\n\nARTIFACT:\n${gen}`
        });
        log.textContent += judge + "\n";
        let verdict = "FAIL";
        try {
          const parsed = JSON.parse(judge.replace(/```json|```/g, "").trim());
          verdict = parsed.verdict || verdict;
          feedback = parsed.feedback || judge;
        } catch {
          verdict = /PASS/i.test(judge) && !/FAIL/i.test(judge) ? "PASS" : "FAIL";
          feedback = judge;
        }
        if (verdict.toUpperCase() === "PASS") {
          log.textContent += "\n— passed —";
          return;
        }
      }
      log.textContent += "\n— budget exhausted —";
    } catch (err) {
      log.textContent += "\nERROR: " + (err.message || err);
    }
  };
}

const graphState = {

function paintGraph() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;
  canvas.innerHTML = `<svg class="wires" id="wires"></svg>` + graphState.nodes.map(n => `
    <div class="gnode ${n.status||""}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px">
      <div class="port in" data-port="in" data-id="${n.id}"></div>
      <strong>${n.title}</strong>
      <div class="muted">${n.type}</div>
      <div class="port out" data-port="out" data-id="${n.id}"></div>
    </div>`).join("");
  drawWires();
  canvas.onpointerdown = onCanvasDown;
  canvas.onpointermove = onCanvasMove;
  window.onpointerup = onCanvasUp;
}

function nodeCenter(id, side) {
  const n = graphState.nodes.find(x => x.id === id);
  return { x: n.x + (side === "out" ? 168 : 0), y: n.y + 22 };
}

function drawWires() {
  const svg = document.getElementById("wires");
  if (!svg) return;
  svg.innerHTML = graphState.edges.map(e => {
    const a = nodeCenter(e.from, "out");
    const b = nodeCenter(e.to, "in");
    const m = (a.x + b.x) / 2;
    return `<path d="M${a.x},${a.y} C${m},${a.y} ${m},${b.y} ${b.x},${b.y}" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".8"/>`;
  }).join("");
}

function onCanvasDown(e) {
  const port = e.target.closest(".port");
  if (port) {
    if (port.dataset.port === "out") graphState.linkFrom = port.dataset.id;
    else if (graphState.linkFrom && graphState.linkFrom !== port.dataset.id) {
      graphState.edges.push({ from: graphState.linkFrom, to: port.dataset.id });
      graphState.linkFrom = null;
      paintGraph();
    }
    return;
  }
  const node = e.target.closest(".gnode");
  if (!node) return;
  const id = node.dataset.id;
  graphState.selected = id;
  const n = graphState.nodes.find(x => x.id === id);
  document.getElementById("g-sel").textContent = `Editing ${n.title} (${n.id})`;
  document.getElementById("g-text").value = n.text || "";
  graphState.drag = { id, dx: e.clientX - n.x, dy: e.clientY - n.y, pid: e.pointerId };
  node.setPointerCapture(e.pointerId);
}

function onCanvasMove(e) {
  if (!graphState.drag) return;
  const n = graphState.nodes.find(x => x.id === graphState.drag.id);
  n.x = Math.max(8, e.clientX - graphState.drag.dx);
  n.y = Math.max(8, e.clientY - graphState.drag.dy);
  const eln = document.querySelector(`.gnode[data-id="${n.id}"]`);
  eln.style.left = n.x + "px";
  eln.style.top = n.y + "px";
  drawWires();
}

function onCanvasUp() { graphState.drag = null; }

function topoSort() {
  const indeg = Object.fromEntries(graphState.nodes.map(n => [n.id, 0]));
  graphState.edges.forEach(e => { if (indeg[e.to] != null) indeg[e.to]++; });
  const q = Object.keys(indeg).filter(k => indeg[k] === 0);
  const out = [];
  while (q.length) {
    const id = q.shift();
    out.push(id);
    graphState.edges.filter(e => e.from === id).forEach(e => {
      indeg[e.to]--;
      if (indeg[e.to] === 0) q.push(e.to);
    });
  }
  if (out.length !== graphState.nodes.length) throw new Error("Cycle detected in DAG");
  return out;
}

async function runGraph() {
  const log = document.getElementById("g-log");
  const provider = document.getElementById("g-provider").value;
  const model = document.getElementById("g-model").value;
  const values = {};
  graphState.nodes.forEach(n => n.status = "");
  paintGraph();
  try {
    const order = topoSort();
    log.textContent = "Order: " + order.join(" → ") + "\n";
    for (const id of order) {
      const n = graphState.nodes.find(x => x.id === id);
      n.status = "running"; paintGraph();
      const upstream = graphState.edges.filter(e => e.to === id).map(e => values[e.from] || "").join("\n---\n");
      let result = n.text || "";
      if (n.type === "input") result = n.text;
      else {
        result = await infer({
          provider, model,
          system: n.type === "output" ? "Merge upstream artifacts into a final answer." : "You are a DAG node. Transform upstream context using your node prompt.",
          user: `NODE PROMPT:\n${n.text}\n\nUPSTREAM:\n${upstream || "(none)"}`
        });
      }
      values[id] = result;
      n.status = "ok"; paintGraph();
      log.textContent += `\n[${n.title}]\n${result}\n`;
    }
    log.textContent += "\n— DAG complete —";
  } catch (err) {
    log.textContent += "\nERROR: " + (err.message || err);
    graphState.nodes.forEach(n => { if (n.status === "running") n.status = "err"; });
    paintGraph();
  }
}

      <input id="m-q" placeholder="Filter models…" style="margin:8px 0">
      <h3>Closed weight</h3>
      <div class="grid g-3" id="m-closed"></div>
      <h3 style="margin-top:16px">Open weight</h3>
      <div class="grid g-3" id="m-open"></div>
    </section>`;
  const paint = (q="") => {
    const f = m => (m.name + m.org).toLowerCase().includes(q.toLowerCase());
    const card = (m, kind) => `
      <div class="card model" data-kind="${kind}" data-name="${m.name}">
        <h3>${m.name}</h3>
        <div class="muted">${m.org} · ctx ${m.ctx} · ${m.reason}</div>
        <div>${m.vis?'<span class="chip ok">vision</span>':'<span class="chip">no vision</span>'}
        ${m.tools?'<span class="chip ok">tools</span>':'<span class="chip">no tools</span>'}
        ${m.json?'<span class="chip ok">json</span>':''}</div>
      </div>`;
    document.getElementById("m-closed").innerHTML = CLOSED_MODELS.filter(f).map(m => card(m,"closed")).join("");
    document.getElementById("m-open").innerHTML = OPEN_MODELS.filter(f).map(m => card(m,"open")).join("");
  };
  paint();
  document.getElementById("m-q").oninput = e => paint(e.target.value);
  document.getElementById("view").onclick = e => {
    const c = e.target.closest(".model");
    if (c) openModel(c.dataset.name, c.dataset.kind);
  };
}

function openModel(name, kind) {
  const m = (kind === "open" ? OPEN_MODELS : CLOSED_MODELS).find(x => x.name === name);
  const sheet = document.getElementById("modal-sheet");
  const fill = (tpl, extra={}) => tpl.replace(/\{\{(\w+)\}\}/g, (_, k) => ({
    model: m.name,
    problem: extra.problem || "design a BYOK inference gateway",
    constraints: extra.constraints || "zero paid APIs, browser-only, CORS-safe",
    tools: extra.tools || "web_search, http_fetch, code_exec",
    task: extra.task || "produce a production-ready plan",
    budget: extra.budget || "3",
    language: extra.language || "Python",
    image_desc: extra.image_desc || "[screenshot of this dashboard]",
    focus: extra.focus || "the DAG canvas",
    user_msg: extra.user_msg || "Continue from the last plan step.",
    role: extra.role || "principal AI infra engineer",
    schema: extra.schema || "{\"title\":\"string\",\"items\":[{\"name\":\"string\",\"url\":\"string\"}]}",
    goal: extra.goal || "stand up a free-tier agent loop"
  }[k] || `{{${k}}}`));
  let cap = CAPS[0];
  const draw = () => {
    const bank = PROMPTS[cap];
    sheet.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">${m.name}</h3>
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
      <p class="muted">${m.org} · ${kind} · context ${m.ctx}</p>
      <div class="row" id="cap-row">${CAPS.map(c => `<button class="btn ${c===cap?"primary":""}" data-cap="${c}">${c}</button>`).join("")}</div>
      <div>${bank.map(([title, tpl], i) => {
        const text = fill(tpl);
        return `<div class="prompt">
          <div class="row" style="justify-content:space-between">
            <strong>${i+1}. ${title}</strong>
            <button class="btn" data-copy="${encodeURIComponent(text)}">Copy</button>
          </div>
          <pre>${text.replace(/</g,"&lt;")}</pre>
        </div>`;
      }).join("")}</div>`;
    sheet.querySelector("#cap-row").onclick = e => {
      const b = e.target.closest("[data-cap]");
      if (!b) return;
      cap = b.dataset.cap;
      draw();
    };
    sheet.onclick = e => {
      const b = e.target.closest("[data-copy]");
      if (b) copyText(decodeURIComponent(b.dataset.copy));
    };
  };
  draw();
  document.getElementById("modal").classList.add("on");
}

function closeModal() { document.getElementById("modal").classList.remove("on"); }

function openKeys() {
  const sheet = document.getElementById("drawer-sheet");
  sheet.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">BYOK vault</h3>
      <button class="btn" onclick="closeKeys()">Close</button>
    </div>
    <p class="muted">Stored in localStorage key <code>zc.byok.v1</code>. Never sent anywhere except the vendor you invoke.</p>
    ${KEY_FIELDS.map(f => `
      <label class="field">${f.label}
        <input id="k-${f.id}" type="password" autocomplete="off" placeholder="${mask(state.keys[f.id])}" value="">
        <span class="muted">${f.hint} · <a href="${f.portal}" target="_blank" rel="noopener">open portal</a></span>
      </label>`).join("")}
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="k-save">Save keys</button>
      <button class="btn" id="k-wipe">Wipe vault</button>
    </div>`;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("k-save").onclick = () => {
    KEY_FIELDS.forEach(f => {
      const v = document.getElementById("k-" + f.id).value.trim();
      if (v) state.keys[f.id] = v;
    });
    saveKeys();
    toast("Keys saved locally");
    closeKeys();
  };
  document.getElementById("k-wipe").onclick = () => {
    state.keys = {};
    saveKeys();
    toast("Vault wiped");
    closeKeys();
  };
}
function closeKeys() { document.getElementById("drawer").classList.remove("on"); }

function wireProvider(pid, mid) {
  const p = document.getElementById(pid);
  const m = document.getElementById(mid);
  const sync = () => { m.innerHTML = modelOptions(p.value); };
  p.addEventListener("change", sync); sync();
}

function need(id, label) {
  const v = state.keys[id];
  if (!v) throw new Error(`Missing ${label}. Open Keys and paste it.`);
  return v;
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function fetchRetry(url, init, tries=3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const res = await fetch(url, init);
      if (res.status === 429 || res.status >= 500) {
        last = new Error(`HTTP ${res.status} ${await res.text()}`);
        await sleep(600 * 2 ** i);
        continue;
      }
      const text = await res.text();
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 500)}`);
      return text;
    } catch (err) {
      last = err;
      if (String(err).includes("Failed to fetch")) {
        throw new Error("Network/CORS blocked this vendor from the browser. Use a provider that allows CORS (Groq, OpenRouter, Gemini often work) or a tiny Worker proxy.");
      }
      if (i === tries - 1) throw last;
      await sleep(400 * 2 ** i);
    }
  }
  throw last;
}

function openaiBody({ model, system, user, json }) {
  const body = {
    model,
    messages: [
      ...(system ? [{ role: "system", content: system }] : []),
      { role: "user", content: user }
    ],
    temperature: 0.4
  };
  if (json) {
    body.response_format = { type: "json_object" };
    body.messages[0] = body.messages[0] || { role: "system", content: "" };
    if (!/json/i.test(body.messages.map(m => m.content).join(" "))) {
      body.messages.unshift({ role: "system", content: "Respond with valid JSON only." });
    }
  }
  return body;
}

function extractOpenAI(text) {
  const data = JSON.parse(text);
  return data.choices?.[0]?.message?.content
    || data.result?.response
    || JSON.stringify(data, null, 2);
}

async function infer({ provider, model, system, user, json }) {
  if (json && system && !/json/i.test(system)) system += " Respond with valid JSON only.";
  if (provider === "groq") {
    const key = need("groq", "Groq API key");
    const text = await fetchRetry("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify(openaiBody({ model, system, user, json }))
    });
    return extractOpenAI(text);
  }
  if (provider === "openrouter") {
    const key = need("openrouter", "OpenRouter key");
    const text = await fetchRetry("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + key,
        "HTTP-Referer": location.href,
        "X-Title": "Zero-Cost Harness Hub"
      },
      body: JSON.stringify(openaiBody({ model, system, user, json }))
    });
    return extractOpenAI(text);
  }
  if (provider === "github") {
    const key = need("github", "GitHub token");
    const text = await fetchRetry("https://models.github.ai/inference/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key, Accept: "application/vnd.github+json" },
      body: JSON.stringify(openaiBody({ model, system, user, json }))
    });
    return extractOpenAI(text);
  }
  if (provider === "huggingface") {
    const key = need("huggingface", "Hugging Face token");
    const text = await fetchRetry("https://router.huggingface.co/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify(openaiBody({ model, system, user, json }))
    });
    return extractOpenAI(text);
  }
  if (provider === "google") {
    const key = need("google", "Google AI Studio key");
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const payload = {
      systemInstruction: system ? { parts: [{ text: system }] } : undefined,
      contents: [{ role: "user", parts: [{ text: user }] }],
      generationConfig: { temperature: 0.4, ...(json ? { responseMimeType: "application/json" } : {}) }
    };
    const text = await fetchRetry(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = JSON.parse(text);
    return data.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || text;
  }
  if (provider === "cloudflare") {
    const account = need("cfAccount", "Cloudflare account ID");
    const token = need("cfToken", "Cloudflare API token");
    const url = `https://api.cloudflare.com/client/v4/accounts/${account}/ai/run/${model}`;
    const messages = [];
    if (system) messages.push({ role: "system", content: system });
    messages.push({ role: "user", content: user });
    const text = await fetchRetry(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ messages })
    });
    const data = JSON.parse(text);
    return data.result?.response || data.result?.output || extractOpenAI(text);
  }
  throw new Error("Unknown provider");
}

function boot() {
  loadKeys();
  if (localStorage.getItem("zc.theme") === "light") document.body.classList.add("light");
  renderTabs();
  setTab("hub");
  setInterval(() => {
    state.scanTick += 1;
    state.lastScan = Date.now();
    if (state.tab === "research") renderResearch();
  }, 20000);
  window.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeKeys(); closeModal(); }
  });
}
boot();
</script>
